[package]
name = "pkgd"
version = "1.5.2"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
sha2 = "0.11.0"
hex = "0.4"
flate2 = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "blocking", "multipart"] }