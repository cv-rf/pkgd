name: Release Pipeline

on:
  release:
    types: [created]

jobs:
  build-and-release:
    name: Build Linux & Termux Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Using 'include' lets us tie the target directly to its naming suffix
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: -amd64-glibc
          - target: x86_64-unknown-linux-musl
            suffix: -amd64-musl
          - target: aarch64-linux-android
            suffix: -termux-aarch64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Android NDK for Termux
        if: matrix.target == 'aarch64-linux-android'
        run: |
          # GitHub Actions has the Android NDK pre-installed. 
          # We just need to tell Cargo where the Android clang linker is!
          CLANG_PATH=$(find $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin -name "aarch64-linux-android24-clang" | head -n 1)
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG_PATH" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$CLANG_PATH" >> $GITHUB_ENV

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Rename and compress binary
        run: |
          mkdir -p dist
          # The matrix.suffix cleanly replaces the messy bash if/else block
          mv target/${{ matrix.target }}/release/pkgd pkgd-linux${{ matrix.suffix }}
          tar -czvf pkgd-linux${{ matrix.suffix }}.tar.gz pkgd-linux${{ matrix.suffix }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pkgd-linux*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}