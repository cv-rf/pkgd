name: Release Pipeline

on:
  release:
    types: [created]

jobs:
  build-and-release:
    name: Build Linux Static Binary
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
        
      - name: Rename and compress binary
        run: |
          mv target/x86_64-unknown-linux-musl/release/pkgd pkgd-linux-amd64
          tar -czvf pkgd-linux-amd64.tar.gz pkgd-linux-amd64

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pkgd-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}